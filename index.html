<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SegurIA - Assistente Virtual</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --chat-bg: rgba(30, 41, 59, 0.7);
            --user-msg: #3b82f6;
            --ai-msg: rgba(51, 65, 85, 0.8);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #10b981;
        }

        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, var(--bg-color), #1e1b4b);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 800px;
            height: 90vh;
            background: var(--chat-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        .header {
            padding: 24px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            gap: 16px;
            background: rgba(15, 23, 42, 0.4);
        }

        .logo {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, var(--accent), #34d399);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }

        .header-info h1 {
            margin: 0;
            font-size: 1.25rem;
            font-weight: 600;
        }

        .header-info p {
            margin: 4px 0 0;
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        .chat-box {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
        }

        .message {
            max-width: 80%;
            padding: 16px;
            border-radius: 16px;
            font-size: 0.95rem;
            line-height: 1.5;
            animation: fadeIn 0.3s ease-out forwards;
            opacity: 0;
            transform: translateY(10px);
        }

        @keyframes fadeIn {
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            align-self: flex-end;
            background: var(--user-msg);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.ai {
            align-self: flex-start;
            background: var(--ai-msg);
            border-bottom-left-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .input-area {
            padding: 20px 24px;
            background: rgba(15, 23, 42, 0.6);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            gap: 12px;
        }

        input {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 16px 20px;
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            font-family: inherit;
            outline: none;
            transition: all 0.2s;
        }

        input:focus {
            border-color: var(--user-msg);
            background: rgba(255, 255, 255, 0.1);
        }

        button {
            background: var(--user-msg);
            color: white;
            border: none;
            padding: 0 24px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        button:hover {
            background: #2563eb;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .typing {
            display: flex;
            gap: 4px;
            padding: 16px;
            background: var(--ai-msg);
            border-radius: 16px;
            border-bottom-left-radius: 4px;
            align-self: flex-start;
            display: none;
        }

        .typing.active {
            display: flex;
        }

        .dot {
            width: 8px;
            height: 8px;
            background: var(--text-muted);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="logo">🛡️</div>
            <div class="header-info">
                <h1>SegurIA</h1>
                <p>Assistente Virtual de Prevenção a Fraudes</p>
            </div>
        </div>

        <div class="chat-box" id="chat-box">
            <div class="message ai">Olá! Sou o SegurIA, seu assistente de segurança bancária. Como posso te ajudar a proteger sua conta hoje?</div>
        </div>
        
        <div class="typing" id="typing-indicator">
            <div class="dot"></div><div class="dot"></div><div class="dot"></div>
        </div>

        <div class="input-area">
            <input type="text" id="user-input" placeholder="Ex: Acho que clonaram meu cartão..." autocomplete="off">
            <button onclick="sendMessage()">Enviar</button>
        </div>
    </div>

    <script>
        // Não precisamos mais de Chave de API! O sistema vai funcionar simulado para o seu vídeo.
        const API_KEY = "SIMULADO";

        const systemInstruction = `Atue como um especialista em segurança bancária. 
Sua tarefa é acalmar o cliente e dar instruções claras sobre como agir em caso de fraude.
Use linguagem simples, não invente dados financeiros e nunca peça a senha do usuário.
Baseie-se apenas nestas diretrizes:
1. Cartão Clonado: Orientar a bloquear o cartão imediatamente no app e contestar a compra.
2. Golpe do Pix: Orientar a acionar o chat do banco urgente para tentar o bloqueio cautelar (MED) e registrar um B.O.
3. Phishing (Links Falsos): O banco nunca envia links pedindo senhas. Se o cliente clicou, ele deve trocar a senha imediatamente.`;

        let chatHistory = [];

        async function sendMessage() {
            const inputField = document.getElementById('user-input');
            const message = inputField.value.trim();
            if (!message) return;

            addMessage(message, 'user');
            inputField.value = '';
            
            document.getElementById('typing-indicator').classList.add('active');

            // Simulando o tempo de resposta da IA (2 segundos) para ficar perfeito no vídeo
            setTimeout(() => {
                document.getElementById('typing-indicator').classList.remove('active');
                
                let aiReply = "";
                const msgLower = message.toLowerCase();
                
                if (msgLower.includes("clona") || msgLower.includes("cartão") || msgLower.includes("cartao")) {
                    aiReply = "Entendo a sua preocupação e estou aqui para ajudar! A primeira coisa a fazer é **bloquear o seu cartão imediatamente** pelo aplicativo do banco.\n\nDepois disso, acesse a área de contestações no app para relatar as compras que você não reconhece. Fique calmo, não solicitaremos sua senha em nenhum momento.";
                } else if (msgLower.includes("pix") || msgLower.includes("golpe")) {
                    aiReply = "Para casos de golpe do Pix, é muito importante agir rápido. Entre em contato urgente com o nosso chat de atendimento para tentarmos o **bloqueio cautelar (MED)**.\n\nRecomendo fortemente que você também registre um Boletim de Ocorrência (B.O.).";
                } else {
                    aiReply = "Compreendo. Como especialista em segurança, oriento que você nunca clique em links suspeitos ou compartilhe suas senhas. Se houver alguma movimentação estranha, bloqueie sua conta pelo aplicativo imediatamente.";
                }
                
                chatHistory.push({ role: "user", text: message });
                chatHistory.push({ role: "model", text: aiReply });

                addMessage(aiReply, 'ai');
            }, 2000);
        }

        function addMessage(text, sender) {
            const chatBox = document.getElementById('chat-box');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}`;
            
            // Format bold text
            text = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            
            msgDiv.innerHTML = text.replace(/\n/g, '<br>');
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        document.getElementById('user-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
